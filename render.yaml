services:
  - type: web
    name: supervillain-api-jwt
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.x
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
